name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest          # Apple Silicon runner
    steps:
      - uses: actions/checkout@v5

      - name: Build app + pkg + zip
        run: scripts/build.sh --dist

      - name: Engine check (new engine vs original regex scan)
        run: scripts/engine-check.sh

      - uses: actions/upload-artifact@v5
        with:
          name: avro-keyboard-${{ github.sha }}
          path: build/dist/*
          retention-days: 14

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python reference equivalence check
        run: python3 tools/reference/check_equivalence.py .
